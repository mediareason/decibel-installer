name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundle
        run: node build/build.mjs

      # Boots the packed entry point for real and asserts it exposes no pro/apps
      # facades. This is the gate that keeps a wallet-reading facade out of a
      # non-technical user's Claude Desktop — keep it ahead of the upload.
      - name: Test bundle
        run: npm test

      - name: Name the release asset
        id: asset
        run: |
          # Name the versioned artifact explicitly rather than globbing — a stray
          # .mcpb in dist/ would otherwise decide which file gets published.
          bundle=$(node -p "require('./package.json').version")
          server=$(node -p "require('./package.json').decibel.serverVersion")
          cp "dist/decibeltools-${bundle}.mcpb" dist/decibeltools.mcpb
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          echo "version=${server}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/decibeltools.mcpb
          generate_release_notes: true
          body: |
            Decibel Tools ${{ steps.asset.outputs.bundle }} for Claude Desktop — server ${{ steps.asset.outputs.version }}.

            **Install:** download `decibeltools.mcpb` below, double-click it, pick your
            project folder, click Install. Then fully quit Claude Desktop (⌘Q /
            Alt+F4) and reopen.

            No Node.js, terminal, or config file needed.

      - uses: actions/upload-artifact@v4
        with:
          name: decibeltools-mcpb
          path: dist/decibeltools.mcpb
